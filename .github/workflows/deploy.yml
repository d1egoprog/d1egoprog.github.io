name: Build & Deploy Production Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Source lives on main; Settings > Pages must serve gh-pages / (root).
concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Never publish this production workflow from the development repository.
    if: github.repository == 'd1egoprog/d1egoprog.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SITE_NOINDEX: 'false'
      ASTRO_BASE_PATH: '/'

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/research/index.html
          test -f dist/404.html

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: www.d1egoprog.co
          commit_message: 'Deploy website v2.0'
